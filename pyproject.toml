[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-sdlc-kit"
description = "A small, harness-neutral AI-native SDLC (intent, spec, plan, test, code, review) you can drop into any git project"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "local-sdlc-kit maintainers" }]
keywords = [
    "sdlc",
    "ai-coding",
    "agents",
    "intent-spec-plan",
    "process",
    "harness-neutral",
    "claude-code",
    "codex",
    "gemini-cli",
    "github-copilot",
    "cursor",
    "minimax-code",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=5.0"]
docs = ["mkdocs>=1.6,<2"]

[project.urls]
Homepage = "https://github.com/senssei/local-sdlc-kit"
Issues = "https://github.com/senssei/local-sdlc-kit/issues"
Changelog = "https://github.com/senssei/local-sdlc-kit/blob/main/CHANGELOG.md"
Documentation = "https://senssei.github.io/local-sdlc-kit/"

[project.scripts]
local-sdlc-kit-install = "sdlc_kit.install:main"

[tool.setuptools]
packages = ["sdlc_kit"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "sdlc_kit.__version__" }

[tool.setuptools.package-data]
sdlc_kit = ["template/**/*"]